trigger:
  - main

pool:
  name: Default

variables:
  LOCAL_NPM_CACHE: C:\npm_cache
  PIPELINE_NPM_CACHE: $(Pipeline.Workspace)\.npm
  NPM_CONFIG_CACHE: $(LOCAL_NPM_CACHE)

steps:
# Step 1: Checkout
- checkout: self
  clean: true
  fetchDepth: 1
  displayName: 'Checkout code'

# Step 2: Check for local cache (updated condition)
- script: |
    if exist "$(LOCAL_NPM_CACHE)" (
      echo "##vso[task.setvariable variable=LOCAL_CACHE_EXISTS]true"
    )
  displayName: 'Check local cache existence'

# Step 3: Try local cache if exists
- script: |
    npm ci --prefer-offline --no-audit --cache $(LOCAL_NPM_CACHE)
  displayName: 'Install (local cache)'
  condition: eq(variables.LOCAL_CACHE_EXISTS, 'true')

# Step 4: Fallback to pipeline cache
- task: Cache@2
  inputs:
    key: 'npm | "$(Agent.OS)" | "$(node -v)" | package-lock.json'
    restoreKeys: |
      npm | "$(Agent.OS)" | "$(node -v)"
    path: $(PIPELINE_NPM_CACHE)
    cacheHitVar: CACHE_RESTORED
  displayName: 'Restore pipeline cache'
  condition: ne(variables.LOCAL_CACHE_EXISTS, 'true')

# Step 5: Install using pipeline cache
- script: |
    npm ci --prefer-offline --no-audit --cache $(PIPELINE_NPM_CACHE)
  displayName: 'Install (pipeline cache)'
  condition: ne(variables.LOCAL_CACHE_EXISTS, 'true')

# Step 6: Build
- script: |
    npm run build
  displayName: 'Build project'

# Step 7: cache sync with error handling
- script: |
    robocopy $(PIPELINE_NPM_CACHE) $(LOCAL_NPM_CACHE) /MIR /NP /NFL /NDL /R:1 /W:1
    if %ERRORLEVEL% LEQ 3 (
      exit 0
    ) else (
      exit %ERRORLEVEL%
    )
  displayName: 'Sync local cache'
  condition: |
    and(
      succeeded(),
      ne(variables.CACHE_RESTORED, 'true'),
      ne(variables.LOCAL_CACHE_EXISTS, 'true')
    )
  failOnStderr: false

- task: Cache@2
  inputs:
    key: 'npm | "$(Agent.OS)" | "$(node -v)" | package-lock.json'
    path: $(PIPELINE_NPM_CACHE)
  displayName: 'Save pipeline cache'
  condition: |
    and(
      succeeded(),
      ne(variables.CACHE_RESTORED, 'true'),
      ne(variables.LOCAL_CACHE_EXISTS, 'true')
    )
