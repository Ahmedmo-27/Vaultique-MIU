name: Build and deploy Node.js app to Azure Web App

on:
  push:
    branches: [ main ]

env:
  # Use EXACT names from Azure CLI output
  AZURE_WEBAPP_NAME: 'Vaultique'  # Portal name (case-sensitive)
  ACTUAL_HOSTNAME: 'vaultique-d9g7htapdedhbsg0.uaenorth-01.azurewebsites.net'  # From az CLI
  RESOURCE_GROUP: 'appsvc_linux_uaenorth'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20.x'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Build package
      run: |
        mkdir -p deployment
        cp -r package.json package-lock.json src/ deployment/
        cd deployment && zip -r ../release.zip ./*
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: https://${{ env.ACTUAL_HOSTNAME }}  # Use verified hostname

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: node-app
        
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}  # "Vaultique"
        publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
        package: release.zip
    
    - name: Verify deployment
      run: |
        echo "Checking https://${{ env.ACTUAL_HOSTNAME }}"
        curl -s -o /dev/null -w "%{http_code}" \
          https://${{ env.ACTUAL_HOSTNAME }} | \
          grep -q 200 && echo "Success" || (echo "Failed"; exit 1)
