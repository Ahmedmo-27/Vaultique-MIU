name: Build and deploy Node.js app to Azure Web App - Vaultique

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: 'Vaultique'
  RESOURCE_GROUP: 'appsvc_linux_uaenorth'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Create deployment package
        run: |
          # Create deployment directory
          mkdir -p deployment
          
          # Copy essential files that exist
          cp package.json package-lock.json deployment/
          
          # Copy other common directories if they exist
          [ -d "src" ] && cp -r src/ deployment/ || echo "No src directory found"
          [ -d "public" ] && cp -r public/ deployment/ || echo "No public directory found"
          [ -d "dist" ] && cp -r dist/ deployment/ || echo "No dist directory found"
          [ -d "server" ] && cp -r server/ deployment/ || echo "No server directory found"
          
          # Create zip package
          cd deployment && zip -r ../release.zip ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
          slot-name: production
