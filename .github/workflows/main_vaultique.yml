name: Build and deploy Node.js app to Azure Web App - Vaultique

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: 'vaultique-d9g7htapdedhbsg0' # Must match exactly
  RESOURCE_GROUP: 'appsvc_linux_uaenorth'
  SCM_URL: 'vaultique-d9g7htapdedhbsg0.scm.uaenorth-01.azurewebsites.net'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm ci --legacy-peer-deps
          npm audit fix --force || true

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp package.json package-lock.json deployment/
          [ -d "src" ] && cp -r src/ deployment/ || echo "No src directory"
          [ -d "public" ] && cp -r public/ deployment/ || echo "No public directory"
          cd deployment && zip -r ../release.zip ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy using Kudu API (Fallback)
        run: |
          # Extract credentials from publish profile
          USERNAME='$Vaultique'
          PASSWORD='dAY8LwyJEa3liAr4A0jqaKYpAwBqruGGvZEB0n3M2NpguDSMu1qim4KbCK7T'
          
          # Create basic auth token
          AUTH_TOKEN=$(echo -n "$USERNAME:$PASSWORD" | base64)
          
          # Deploy using ZipDeploy API
          curl -X POST \
            -H "Content-Type: application/zip" \
            -H "Authorization: Basic $AUTH_TOKEN" \
            --data-binary @"release.zip" \
            https://${{ env.SCM_URL }}/api/zipdeploy
