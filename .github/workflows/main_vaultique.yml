name: Build and deploy Node.js app to Azure Web App - Vaultique

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: 'Vaultique'
  RESOURCE_GROUP: 'appsvc_linux_uaenorth'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r package.json package-lock.json src/ deployment/
          cd deployment && zip -r ../release.zip ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Check and reset deployment status
        uses: azure/CLI@v1
        with:
          inlineScript: |
            # List active deployments
            echo "Checking active deployments..."
            az webapp deployment list-publishing-credentials \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "scmUri" -o tsv
            
            # Clean up any stuck deployments
            echo "Cleaning up deployments..."
            az webapp deployment source delete \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --delete-command true
            
            # Restart the app service
            echo "Restarting app service..."
            az webapp restart \
              --name ${{ env.AZURE_WEBAPP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }}
            
            sleep 10 # Wait for restart to complete

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: release.zip
          slot-name: production
          enable-oryx-build: false
          clean: true
          restart: false

      - name: Verify deployment
        run: |
          echo "Checking deployment status..."
          curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net | \
            grep -q 200 && echo "Deployment successful" || echo "Deployment verification failed"
